name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  pytest:
    name: pytest (PySide6, offscreen)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Qt's offscreen platform still loads EGL, GL and fontconfig.
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install fxgui with the test and docking extras
        run: |
          python -m pip install --upgrade pip
          pip install ".[test,docking]"

      - name: Lint
        run: |
          pip install ruff
          ruff check --select F,B,BLE .

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
