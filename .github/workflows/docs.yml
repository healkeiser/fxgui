name: Documentation

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# Two deploys at once would race on gh-pages.
concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      # The mike fork for zensical is not on PyPI.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade ".[zensical]" "git+https://github.com/squidfunk/mike.git"

      # strict = true in zensical.toml: a broken link fails here.
      - name: Build
        run: zensical build --clean

      # Only main and tags publish; a run on another branch stops at the build.
      - name: Configure Git
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Fetch gh-pages branch
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            git fetch origin gh-pages:gh-pages
          fi

      - name: Deploy docs (versioned)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: |
          # One version per tag, the newest also as "latest".
          VERSION=$(git describe --tags --abbrev=0 | sed 's/^v//')
          mike deploy --push --update-aliases "$VERSION" latest
          git fetch origin gh-pages:gh-pages --force
          mike set-default --push latest
          mike list
