[project]
site_name = "fxgui"
site_description = "Custom Python classes and utilities tailored for Qt built UI, in VFX-oriented DCC applications."
site_author = "Valentin Beaumont"
copyright = "Valentin Beaumont | Licensed under the MIT License"
# A broken link or anchor fails the build instead of shipping.
strict = true
site_url = "https://healkeiser.github.io/fxgui/"
repo_url = "https://github.com/healkeiser/fxgui"
repo_name = "healkeiser/fxgui"
edit_uri = "edit/main/docs/"

# "Technical" is written by the api-autonav plugin below.
nav = [
  { "Home" = "index.md" },
  { "Installation" = "installation.md" },
  { "Moving from 12.x" = "moving-from-12.md" },
  { "How-to" = ["how-to/index.md", { "Styling" = "how-to/styling.md" }, { "Theming" = "how-to/theming.md" }, { "Widgets" = "how-to/widgets.md" }, { "Icons" = "how-to/icons.md" }] },
  { "Changelog" = "changelog.md" },
]

[project.theme]
favicon = "images/fxgui_logo_background_light.svg"
logo = "images/fxgui_logo_light.svg"
language = "en"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.theme.icon]
repo = "fontawesome/brands/github"

# One version per tag plus "latest", deployed by the mike fork for zensical.
[project.extra.version]
provider = "mike"
default = "latest"
alias = true

# Setting this key replaces zensical's defaults, so it lists them all.
# pymdownx.snippets is here for the changelog page, which includes
# CHANGELOG.md.
[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc = { permalink = true }

[project.markdown_extensions.pymdownx]
b64 = {}
betterem = {}
caret = {}
critic = {}
details = {}
emoji = { emoji_generator = "zensical.extensions.emoji.to_svg", emoji_index = "zensical.extensions.emoji.twemoji" }
highlight = { anchor_linenums = true, line_spans = "__span", pygments_lang_class = true }
inlinehilite = {}
keys = {}
mark = {}
smartsymbols = {}
snippets = { base_path = ["."] }
superfences = { custom_fences = [{ name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }] }
tabbed = { alternate_style = true, combine_header_slug = true }
tasklist = { custom_checkbox = true }
tilde = {}

# A page per public module, and the "Technical" section of the nav.
[project.plugins.api-autonav]
modules = ["fxgui"]
nav_section_title = "Technical"
api_root_uri = "technical"
# No badge in the nav: the theme leaves it no room, gluing "mod" to each name.
nav_item_prefix = ""

[project.plugins.mkdocstrings.handlers.python]
paths = ["."]
inventories = ["https://docs.python.org/3/objects.inv"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
docstring_section_style = "table"
separate_signature = true
show_signature_annotations = true
signature_crossrefs = true
heading_level = 2
show_source = false
show_symbol_type_heading = true
show_symbol_type_toc = true
parameter_headings = true
line_length = 80
show_if_no_docstring = false
show_docstring_attributes = true
annotations_path = "brief"
show_submodules = false
show_root_heading = true
show_root_full_path = false
summary = true
members_order = "alphabetical"
group_by_category = true
show_category_heading = true
merge_init_into_class = true
