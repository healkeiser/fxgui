[build-system]
requires = ["setuptools>=77.0", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "fxgui"
dynamic = ["version"]
description = "Custom Python classes and utilities tailored for Qt built UI, in VFX-oriented DCC applications."
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E*"]
authors = [
    { name = "Valentin Beaumont", email = "valentin.onze@gmail.com" }
]
maintainers = [
    { name = "Valentin Beaumont", email = "valentin.onze@gmail.com" }
]
keywords = ["Qt", "Qt6", "PySide6", "PyQt6", "VFX", "DCC", "UI"]
classifiers = [
    # How mature is this project? Common values are
    # 3 - Alpha
    # 4 - Beta
    # 5 - Production/Stable
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",

    # Indicate who your project is intended for
    "Operating System :: OS Independent",
    "Topic :: Software Development :: User Interfaces",
    "Environment :: X11 Applications :: Qt",

    # Specify the Python versions you support here
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.9"
# A Qt 6 binding is required but not listed: a DCC ships its own PySide6,
# and a second one installed beside it breaks the host.
dependencies = [
    "QtPy>=2.4.2",
    "PyYAML>=6.0",
    "Pygments>=2.0",
]

# No docking extra: every PySide6-QtAds wheel pins one exact PySide6, so
# installing it would replace the binding (see docs/installation.md).
[project.optional-dependencies]
# The documentation site. Unpinned: always the newest zensical.
# Versioned deploys also need the mike fork for zensical, which is not
# on PyPI: pip install git+https://github.com/squidfunk/mike.git
zensical = [
    "zensical",
    "mkdocstrings-python",
    "black",
]
test = [
    "pytest>=7.0",
    "pytest-qt>=4.2",
    # Every run shuffles the order, so a test leaning on another fails.
    "pytest-randomly>=3.0",
    # The oldest PySide6 fxgui supports is Houdini 21's 6.5.3.
    "PySide6>=6.5",
]

[project.urls]
Homepage = "https://github.com/healkeiser/fxgui"
Documentation = "https://healkeiser.github.io/fxgui"
GitHub = "https://github.com/healkeiser/fxgui"
Changelog = "https://github.com/healkeiser/fxgui/blob/main/CHANGELOG.md"
Source = "https://github.com/healkeiser/fxgui"
Funding = "https://github.com/sponsors/healkeiser"

[tool.setuptools.packages.find]
where = ["."]
include = ["fxgui*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.svg", "*.png", "*.qss", "*.zip"]

[tool.setuptools.exclude-package-data]
"*" = [
    "*.js",
    "*.mjs",
    "*.ts",
    "*.css",
    "*.less",
    "*.scss",
    "*.woff",
    "*.woff2",
    "*.ttf",
    "*.eot",
    "*.otf",
    "*.json",
    "*.txt",
    "*.md",
    ".gitignore",
    ".gitattributes",
    ".editorconfig",
    "Dockerfile",
]

[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Headless platform is set in tests/conftest.py before Qt is imported.
