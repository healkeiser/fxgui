# =============================================================================
# FXGUI THEME CONFIGURATION FILE
# =============================================================================
# This file defines all colors used throughout fxgui. Users can create custom
# themes by copying this file and modifying the values.
#
# To use a custom theme, call:
#   fxstyle.set_color_file("path/to/your/custom_theme.yaml")
#
# Color Format: All colors use hexadecimal format (#RRGGBB or #AARRGGBB)
#
# YAML Inheritance: Themes can inherit from base themes using YAML anchors.
# Define a base with `&anchor_name` and inherit with `<<: *anchor_name`.
# Override specific colors after inheritance as needed.
# =============================================================================

# =============================================================================
# DCC INTEGRATION COLORS
# =============================================================================
# Branding colors for Digital Content Creation software.

dcc:
  houdini: "#ff6600"
  maya: "#38a5cc"
  nuke: "#f9b621"
  megascans: "#8ecd4f"
  bridge: "#1aa9f3"
  3dsmax: "#38a5cc"
  blender: "#eb7a08"
  cinema4d: "#6796fa"
  redshift: "#f94067"


# =============================================================================
# FONTS
# =============================================================================
# Typefaces by role, the way the sections above name colors by role. Each
# role is a family stack: the first family the running Qt has wins, and the
# platform default UI font is appended, so a role never resolves to nothing.
#
#   title - Text marked with `fxstyle.mark_as_title(widget)`. Left empty
#           here, so it draws like body until a family is named.
#   body  - Every widget: the root font of each themed window.
#   mono  - Code, logs, anything whose columns must line up.
#
# A role is a list of families, or a mapping that also names a weight
# (100 to 900, as in CSS) and a hinting ("default", "none", "vertical",
# "full"). The body role's weight and hinting go on the root font;
# `fxstyle.font(role=...)` builds any role's QFont.
#
#   body: {family: ["Inter"], weight: 500, hinting: "none"}
#
# `ranks` is not a role: it sizes headings marked with
# `fxstyle.mark_as_title(widget, rank="section")`. Each rank names a pixel
# size and a weight; left out, "section" is 15 px and "card" 16 px, both
# at 600. A rank named here replaces the built-in one of that name.
#
#   ranks:
#     section: {size: 15, weight: 600}
#
# An empty value, a missing role or a missing section means the platform
# default: Segoe UI on Windows, the system UI font elsewhere.
#
# To use your own typefaces, register the files, then overlay a file that
# names them:
#
#   fxstyle.register_fonts(["/path/to/YourFace-Regular.ttf"])
#   fxstyle.overlay_color_file("path/to/studio_fonts.yaml")
#
# `register_fonts` returns the family names Qt registered from each file,
# which are the names to write here; an empty list means the file did not
# load. A family that is neither installed nor registered is dropped.
#
# A theme may override this block with its own `fonts:` section, merged
# role by role, exactly as it may override `feedback:`.

fonts:
  title: []
  body: []
  mono: ["Consolas", "Courier New", "monospace"]


# =============================================================================
# THEME DEFINITIONS
# =============================================================================
# Themes use YAML anchors for inheritance. The dark theme serves as the base,
# and other themes inherit from it, overriding only the colors that differ.
#
# COLOR REFERENCE:
#
# Accent Colors:
#   accent_primary    - Selection, keyboard focus, the current item, the primary action
#   accent_secondary  - A primary button's hover fill and a pressed menu item
#
# Surface Colors (Backgrounds):
#   surface           - Main widget/window backgrounds
#   surface_alt       - Alternating row backgrounds
#   surface_sunken    - Input fields, lists, menus, status bar
#   frame             - (Optional) Chrome around the panes of a framed window, auto-computed if omitted
#   well              - (Optional) Lists and logs set into a pane, auto-computed if omitted
#   pane_border       - (Optional) 1 px edge of a pane on the frame, auto-computed if omitted
#   splitter_mark     - (Optional) Dots on a marked splitter handle, auto-computed if omitted
#   tooltip          - Tooltip backgrounds
#
# Border Colors:
#   border            - Standard borders (inputs, containers, menus)
#   border_light      - Subtle borders (tooltips, buttons, tabs)
#   border_strong     - Emphasized borders (frames, separators)
#
# Text Colors:
#   text              - Primary text; darkened or lightened to 4.5:1 on every surface and state fill
#   text_muted        - Secondary text and inactive tabs; held to 4.5:1 as text is, except on state_pressed
#   text_disabled     - Disabled widget text
#   text_on_accent_primary   - (Optional) Text on accent_primary backgrounds, auto-computed if omitted
#   text_on_accent_secondary - (Optional) Text on accent_secondary backgrounds, auto-computed if omitted
#
# Interactive State Colors:
#   state_hover       - Hover fill of rows, buttons and tool buttons; the current tab
#   state_pressed     - Pressed and checked fills; pushed to 1.2:1 from state_hover
#
# Shadow:
#   shadow            - Colour of a floating card's drop shadow, #AARRGGBB
#   shadow_blur       - Its blur radius in pixels
#
# Scrollbar Colors:
#   scrollbar_track       - Scrollbar track/gutter
#   scrollbar_thumb       - Scrollbar draggable handle
#   scrollbar_thumb_hover - Scrollbar thumb on hover
#
# Layout Colors:
#   grid              - Table/header gridlines
#
# Icon Colors:
#   icon                     - Tint color for monochrome icons
#   icon_on_accent_primary   - (Optional) Icon color on accent_primary backgrounds, auto-computed if omitted
#   icon_on_accent_secondary - (Optional) Icon color on accent_secondary backgrounds, auto-computed if omitted

themes:
  # ===========================================================================
  # DARK THEME (Default) - Base theme for dark variants
  # ===========================================================================
  dark: &dark # Accent colors
    accent_primary: "#2196F3"
    accent_secondary: "#1976D2"

    # Surface colors
    surface: "#302f2f"
    surface_alt: "#2d2c2c"
    surface_sunken: "#202020"
    tooltip: "#202020"

    # Border colors
    border: "#3a3939"
    border_light: "#4a4949"
    border_strong: "#444444"

    # Text colors
    text: "#bbbbbb"
    # Muted must be visibly distinct from `text` while keeping >= 4.5:1
    # contrast on `surface` (was #b1b1b1, indistinguishable from #bbbbbb)
    text_muted: "#9a9a9a"
    text_disabled: "#777777"
    text_on_accent_primary: "#ffffff"
    text_on_accent_secondary: "#ffffff"

    # Interactive states
    state_hover: "#403f3f"
    state_pressed: "#4a4949"

    # Scrollbar
    scrollbar_track: "#2a2929"
    scrollbar_thumb: "#605f5f"
    scrollbar_thumb_hover: "#727272"

    # Layout
    grid: "#4a4949"


    # Shadow
    shadow: "#50000000"
    shadow_blur: 20

    # Icon colors
    icon: "#b4b4b4"
    icon_on_accent_primary: "#ffffff"
    icon_on_accent_secondary: "#ffffff"

    # Feedback colors (dark theme)
    feedback:
      debug:
        foreground: "#26C6DA"
        background: "#006064"
      info:
        foreground: "#7661f6"
        background: "#372d75"
      success:
        foreground: "#8ac549"
        background: "#466425"
      warning:
        foreground: "#ffbb33"
        background: "#7b5918"
      error:
        foreground: "#ff4444"
        background: "#7b2323"

  # ===========================================================================
  # LIGHT THEME
  # ===========================================================================
  light: &light # Accent colors
    accent_primary: "#1976D2"
    accent_secondary: "#1565C0"

    # Surface colors
    surface: "#f0f0f0"
    surface_alt: "#fafafa"
    surface_sunken: "#ffffff"
    tooltip: "#ffffe1"

    # Border colors
    border: "#e0e0e0"
    border_light: "#bdbdbd"
    border_strong: "#cacaca"

    # Text colors
    text: "#212121"
    text_muted: "#616161"
    text_disabled: "#757575"
    text_on_accent_primary: "#ffffff"
    text_on_accent_secondary: "#ffffff"

    # Interactive states
    state_hover: "#d8d8d8"
    state_pressed: "#bdbdbd"

    # Scrollbar
    scrollbar_track: "#f5f5f5"
    scrollbar_thumb: "#9e9e9e"
    scrollbar_thumb_hover: "#616161"

    # Layout
    grid: "#bdbdbd"


    # Shadow
    shadow: "#28000000"
    shadow_blur: 20

    # Icon colors
    icon: "#424242"
    icon_on_accent_primary: "#ffffff"
    icon_on_accent_secondary: "#ffffff"

    # Feedback colors (light theme)
    feedback:
      debug:
        foreground: "#00838F"
        background: "#80DEEA"
      info:
        foreground: "#5E35B1"
        background: "#B39DDB"
      success:
        foreground: "#2E7D32"
        background: "#A5D6A7"
      warning:
        foreground: "#E65100"
        background: "#FFCC80"
      error:
        foreground: "#C62828"
        background: "#EF9A9A"

